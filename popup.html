<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Detour Router</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Marketplace Detour Router</h1>

    <section class="section">
      <dl id="details" hidden>
        <div class="row">
          <dt>Listing location</dt>
          <dd id="location-text">&mdash;</dd>
        </div>
        <div class="row">
          <dt>Coordinates</dt>
          <dd id="coordinates" class="mono">&mdash;</dd>
        </div>
        <div class="row">
          <dt>Approx. radius</dt>
          <dd id="radius">&mdash;</dd>
        </div>
      </dl>

      <p id="fallback">Open a listing to see its location.</p>
      <p id="debug" class="debug" hidden></p>
    </section>

    <section class="section">
      <h2>Your locations</h2>

      <button type="button" id="get-location" class="button">
        Get current location
      </button>
      <p id="geo-status" class="note" hidden></p>

      <div class="address-form">
        <label class="visually-hidden" for="address-input">Address</label>
        <input
          type="text"
          id="address-input"
          placeholder="Search for an address"
          maxlength="200"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="address-suggestions"
          aria-expanded="false"
        />
        <ul
          id="address-suggestions"
          class="suggestions"
          role="listbox"
          aria-label="Address suggestions"
          hidden
        ></ul>
      </div>
      <p id="address-status" class="note" hidden></p>

      <div id="capture" class="capture" hidden>
        <p id="captured-address">&mdash;</p>
        <p class="mono coords-line" id="captured-coords">&mdash;</p>
        <div class="capture-form">
          <label class="visually-hidden" for="label-input">Label</label>
          <input
            type="text"
            id="label-input"
            placeholder="Label (e.g. Home)"
            maxlength="40"
            autocomplete="off"
          />
          <button type="button" id="save-location" class="button" disabled>
            Save
          </button>
        </div>
      </div>

      <p id="saved-empty" class="note">No saved locations yet.</p>
      <ul id="saved-list" class="saved-list"></ul>
    </section>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
