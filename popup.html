<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Detour Router</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Marketplace Detour Router</h1>

    <dl id="details" hidden>
      <div class="row">
        <dt>Listing location</dt>
        <dd id="location-text">&mdash;</dd>
      </div>
      <div class="row">
        <dt>Coordinates</dt>
        <dd id="coordinates" class="mono">&mdash;</dd>
      </div>
      <div class="row">
        <dt>Approx. radius</dt>
        <dd id="radius">&mdash;</dd>
      </div>
    </dl>

    <p id="fallback">Open a listing to see its location.</p>
    <p id="debug" class="debug" hidden></p>

    <script src="popup.js"></script>
  </body>
</html>
